name: Build MasterScanner EXE

on:
  workflow_dispatch: # Permite que você inicie a criação manualmente

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psutil pyinstaller python-evtx
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --uac-admin --name "MasterScanner_Forense_v2" master_scanner.py
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: MasterScanner_Executable
        path: dist/MasterScanner_Forense_v2.exe
